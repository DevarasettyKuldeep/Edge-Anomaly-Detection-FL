[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-anomaly-flwr"
version = "0.1.0"
description = "Federated Learning module for edge anomaly detection"
authors = [{ name = "Edge AI Team" }]
dependencies = [
    "flwr>=1.8.0",
    "torch>=2.0.0",
    "numpy>=1.24.0"
]
requires-python = ">=3.10"
