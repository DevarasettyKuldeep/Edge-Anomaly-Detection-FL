name: Edge Anomaly Detection CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  python-tests:
    name: Python & Model Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml_pipeline/requirements.txt
          pip install -r flwr/requirements.txt
          pip install pytest pytest-cov

      - name: Run pytest test suite
        run: pytest -v tests/

      - name: Test quick training step
        run: |
          python ml_pipeline/train_autoencoder.py --epochs 2 --batch-size 32

      - name: Test quantization & C header export
        run: |
          python ml_pipeline/quantize_model.py --input models/autoencoder_final.pth --output firmware/model.tflite --header firmware/model.h

  firmware-build:
    name: Embedded Firmware Build & C Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++

      - name: Configure CMake
        run: cmake -B firmware/build -S firmware -DCMAKE_BUILD_TYPE=Release

      - name: Build firmware binaries
        run: cmake --build firmware/build --config Release -j4

      - name: Run C unit tests with ctest
        run: ctest --test-dir firmware/build --output-on-failure

      - name: Run desktop anomaly detector verification
        run: ./firmware/build/anomaly_detector

  docs-and-compliance:
    name: Documentation & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify repository structure and documentation
        run: |
          test -f README.md && echo "✅ README.md exists"
          test -f LICENSE && echo "✅ LICENSE exists"
          test -f docs/architecture.md && echo "✅ docs/architecture.md exists"
          test -f docs/technical_report.md && echo "✅ docs/technical_report.md exists"
          test -f firmware/model.h && echo "✅ firmware/model.h exists"
